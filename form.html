<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      label {
        display: block;
        margin-bottom: 10px;
      }
      form {
        /* background-color: rgb(181, 110, 16); */
        border: 2px solid black;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="form.html">Form</a></li>
          <li><a href="table.html">Table</a></li>
          <li><a href="blog.html">Blog</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section>
        <h2>Please fill up the form</h2>
        <form action="">
          <label for="">Your Name
            <input id="name" type="text" placeholder="Your Name" />
          </label>

          <label for="email"
            >Email
            <input type="email" name="" id="email" placeholder="Your Email" />
          </label>

          <label for="Phone"
            >Your Phone
            <input type="tel" name="" id="phone" placeholder="Your Phone" />
          </label>

          <fieldset>
            <legend>Pick One Pitha</legend>

            <label for="chatoi"
              >Chatoi
              <input type="radio" name="pitha" id="chatoi" />
            </label>
            <label for=""
              >Vapa
              <input type="radio" name="pitha" id="vapa" />
            </label>
            <label for="puri"
              >Puri
              <input type="radio" name="pitha" id="puri" />
            </label>
          </fieldset>

          <fieldset>
            <legend>Pick Vorta as many as you can</legend>
            <label for="shorisa"
              >Shorisha
              <input type="checkbox" name="shorisha" id="shorisha" />
            </label>

            <label for="shutki"
              >Shutki
              <input type="checkbox" name="shutki" id="shutki" />
            </label>

            <label for="rashun"
              >Rashun
              <input type="checkbox" name="rashun" id="rashun" />
            </label>
          </fieldset>

          <fieldset>
            <legend>Special Instruction</legend>
            <textarea name="" id="" cols="30" rows="5"></textarea>
          </fieldset>
          <input type="reset" value="Reset" />
          <input type="submit" value="Submit" />
        </form>
      </section>
    </main>
  </body>
</html>
